# 推送到 main 且 cloudflare/ 目录有变化时，自动部署到 Cloudflare Workers
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（权限：Workers Scripts:Edit + Workers KV/D1/Durable Objects 相关 Edit）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare 账号 ID（控制台右侧栏可复制）
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: {} # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
